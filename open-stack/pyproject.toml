[project]
name = "case-resolution-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=37",
    "fastmcp>=2.11",
    "jsonschema>=4.23",
    "langgraph>=0.6",
    "litellm>=1.75",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
