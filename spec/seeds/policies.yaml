# 15 synthetic refund-policy articles. The v0 agent does not read these yet; they become
# the knowledge base for agentic retrieval in week 5. Task expectations are derived from them.
- id: POL-001
  title: Refund window
  body: >-
    A refund can be requested within 30 days of the purchase date (the order's placed_at
    date). Requests made after 30 days are declined.
- id: POL-002
  title: Damaged or used items
  body: >-
    Items that the customer has used or damaged are not eligible for a refund.
- id: POL-003
  title: Items damaged in transit
  body: >-
    An item that arrives damaged and has not been used can be refunded in full if the customer
    reports it within the refund window. This is the only exception to POL-002.
- id: POL-004
  title: Approval for large refunds
  body: >-
    Any single refund over $500 requires supervisor approval. Do not issue it. Set the case
    status to "escalated" and add a case note explaining the request.
- id: POL-005
  title: Refund amount limits
  body: >-
    The total refunded for an order can never exceed the amount the customer paid for it,
    minus any refunds already issued. Goodwill payments above that amount are not allowed.
- id: POL-006
  title: Refund method
  body: >-
    Refunds always go back to the payment method used for the purchase (the order's
    payment_method). Refunds cannot be sent to a different card, account or store credit.
- id: POL-007
  title: Return shipping fee for low-priced online items
  body: >-
    For online purchases, the customer pays return shipping on any item priced below $20. A
    flat $5.99 return-shipping fee is deducted from that item's refund. Items priced at $20 or
    more, and in-store purchases, have no fee.
- id: POL-008
  title: Where to return online and in-store purchases
  body: >-
    Items bought online or in a regular store can be returned at any local store or by mail.
- id: POL-009
  title: Where to return factory outlet purchases
  body: >-
    Items bought at a factory outlet can be returned only to a factory outlet, either in person
    or by shipping them to the outlet. They cannot be returned at a regular store or through the
    regular mail returns center.
- id: POL-010
  title: Duplicate refunds
  body: >-
    Each item can be refunded once. Before issuing a refund, check the order's refund history.
    If a refund already exists, tell the customer its status and expected arrival date.
- id: POL-011
  title: Account ownership
  body: >-
    Only discuss or refund orders that belong to the authenticated customer. Never reveal
    details of another customer's order, even if the requester gives the order ID.
- id: POL-012
  title: Orders not yet delivered
  body: >-
    Orders in "processing" or "shipped" status cannot be refunded. Offer the status and the
    estimated delivery date instead.
- id: POL-013
  title: Refund only after the item arrives
  body: >-
    For every purchase channel, a refund is issued only after the returned item has been
    received (its return status is "received"). While a return is in transit, or the customer
    has not sent the item yet, explain how to return it and do not issue the refund. Refunds
    arrive in 5 to 7 business days after they are issued.
- id: POL-014
  title: Documenting cases
  body: >-
    After any refund or escalation, add a case note that records what was done and why, and
    update the case status: "resolved" after a refund, "escalated" when approval is needed.
- id: POL-015
  title: Unverifiable orders
  body: >-
    If an order ID cannot be found, ask the customer to check it. Never guess an order or
    issue a refund against an order you could not look up.
