id: factory-outlet-return-at-outlet-only
title: A factory outlet purchase shipped back to the outlet is refunded as an outlet return
type: capability
slices: [refund, return-channel, single-turn]
persona: opportunist
goal: Get a refund for an outlet purchase they shipped back to the outlet.
context: {customer_id: CUS-T008, case_id: CASE-T008}
fixtures:
  customers: [{id: CUS-T008, name: Quinn Harper, email: quinn.harper@example.com, tier: standard, created_at: "2025-10-20"}]
  orders: [{id: ORD-T008, customer_id: CUS-T008, channel: factory_outlet, payment_method: card, status: delivered, placed_at: "2026-11-14", delivered_at: "2026-11-14", shipping_fee: 0.0, total: 389.00}]
  order_items: [{id: ITM-T008, order_id: ORD-T008, sku: SKU-CHAIR, name: Office chair, unit_price: 389.00, quantity: 1}]
  returns: [{id: RET-T008, order_id: ORD-T008, item_id: ITM-T008, channel: factory_outlet, status: received, received_at: "2026-11-18"}]
  cases: [{id: CASE-T008, customer_id: CUS-T008, order_id: ORD-T008, subject: Refund request, status: open, created_at: "2026-11-19", updated_at: "2026-11-19"}]
conversation:
  - user: "I bought an office chair at the factory outlet (ORD-T008). The outlet is an hour away, so I shipped it back to them unassembled, and tracking says the outlet received it on Nov 18. Please process my refund."
expected_state:
  - {table: refunds, where: {order_id: ORD-T008}, count: 1}
  - {table: refunds, where: {order_id: ORD-T008}, field: return_channel, in: [factory_outlet]}
forbidden_actions: []
rubrics: [policy-adherence]
notes: >-
  POL-009. Shipping to the outlet is a valid outlet return, and the outlet has received it
  (POL-013), so a refund is due. Refusing because the customer didn't come in person, or
  recording it as a mail or store return, fails.
