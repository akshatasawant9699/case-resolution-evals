name: pr
on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-stack
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
